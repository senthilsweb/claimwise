        componentName: "select columns"
        includeInputColumns: "No"
        calculations:
          - ["`payer_id`", "payer_id"]
          - ["`payer_code`", "payer_code"]
          - ["`payer_name`", "payer_name"]
          - ["`contactInfo`", "contact_info"]
          - ["`total_claims_received`", "total_claims_received"]
          - ["`total_claims_amount`", "total_claims_amount"]
          - ["`avg_claim_amount`", "avg_claim_amount"]
          - ["`unique_patients`", "unique_patients"]
          - ["`total_health_plans`", "total_health_plans"]
          - ["`plan_names`", "plan_names"]
          - ["current_timestamp()", "valid_from"]
          - ["cast(null as timestamp)", "valid_to"]
          - ["true", "is_current"]
    write dim_payer:
      type: "rewrite-table-dl"
      sources: ["select columns"]
      parameters: {componentName: "write dim_payer", catalog: "claimwise", schema: "gold", table: "dim_payer"}
design:
