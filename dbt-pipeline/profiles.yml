healthcare_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'rcm.duckdb') }}"
      schema: bronze
      threads: 8

    prod:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'rcm') }}"
      schema: bronze
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8
      # Note: project SQL uses unquoted identifiers only. Double-quoted
      # identifiers break on serverless SQL warehouses (double quotes are
      # string literals; the ANSI session option is not settable there —
      # confirmed live 2026-07-17).

elementary:
  target: prod
  outputs:
    prod:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'rcm') }}"
      schema: elementary
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8
