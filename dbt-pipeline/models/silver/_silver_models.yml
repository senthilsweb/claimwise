version: 2

# Daily validation checks from the data-quality framework:
# uniqueness constraints, not-null checks, and code validations.

models:
  - name: stg_users
    columns:
      - name: id
        tests: [unique, not_null]
      - name: userID
        tests: [unique, not_null]
      - name: userType
        tests:
          - not_null
          - accepted_values:
              values: ['PATIENT', 'DOCTOR', 'STAFF', 'PAYER']

  - name: stg_claims
    columns:
      - name: id
        tests: [unique, not_null]
      - name: claimID
        tests: [unique, not_null]
      - name: amount
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['Submitted', 'In Review', 'Approved', 'Denied', 'Appealed']

  - name: stg_collections
    columns:
      - name: id
        tests: [unique, not_null]
      - name: collectionID
        tests: [unique, not_null]
      - name: methodOfCollection
        tests:
          - accepted_values:
              values: ['Cash', 'Credit Card', 'Bank Transfer', 'Check', 'Electronic Payment']
      - name: status
        tests:
          - accepted_values:
              values: ['Processed', 'Pending', 'Completed', 'Failed']

  - name: stg_encounters
    columns:
      - name: id
        tests: [unique, not_null]
      - name: encounterID
        tests: [unique, not_null]
      - name: type
        tests:
          - accepted_values:
              values: ['Initial Visit', 'Follow-up', 'Emergency', 'Routine Checkup', 'Specialist Consultation']

  - name: stg_activities
    columns:
      - name: id
        tests: [unique, not_null]
      - name: activityID
        tests: [unique, not_null]
      - name: activityType
        tests:
          - accepted_values:
              values: ['Submission', 'Review', 'Documentation Request', 'Appeal', 'Payment Processing']

  - name: stg_facilities
    columns:
      - name: id
        tests: [unique, not_null]
      - name: facilityID
        tests: [unique, not_null]

  - name: stg_health_plans
    columns:
      - name: id
        tests: [unique, not_null]
      - name: healthPlanID
        tests: [unique, not_null]
