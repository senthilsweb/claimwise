version: 2

# Metric layer — all KPI aggregation is defined once here. Dashboards and
# other consumers select these columns without re-computing.

models:
  - name: mtr_executive_summary
    description: "Single-row executive KPI summary (billed, collected, rates, open AR, cycle days)"
    columns:
      - name: gross_billed
        tests: [not_null]
      - name: collection_rate_pct
        tests: [not_null]

  - name: mtr_revenue_monthly
    description: "Billed vs collected by calendar month with collection rate"
    columns:
      - name: month
        tests: [unique, not_null]

  - name: mtr_payer_scorecard
    description: "Per-payer billing scorecard: billed, collected, rates, open AR"
    columns:
      - name: payer_name
        tests: [unique, not_null]

  - name: mtr_ar_aging
    description: "Open AR by payer and aging bucket (0-30/31-60/61-90/90+)"
    columns:
      - name: open_ar_amount
        tests: [not_null]

  - name: mtr_claims_funnel
    description: "Claim counts and amounts by lifecycle status"
    columns:
      - name: claim_status
        tests: [unique, not_null]

  - name: mtr_department_activity
    description: "Encounter volumes by medical specialty (no revenue attribution)"
    columns:
      - name: specialty
        tests: [unique, not_null]
