name: 'healthcare_analytics'
version: '1.0.0'
config-version: 2

profile: 'healthcare_analytics'

flags:
  require_explicit_package_overrides_for_builtin_materializations: false

vars:
  'dbt_date:time_zone': 'America/New_York'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Quoting configuration — identifiers stay unquoted everywhere. Databricks
# serverless SQL treats double quotes as string literals (the ANSI option is
# not settable there), and unquoted camelCase resolves case-insensitively on
# DuckDB, Databricks, and Snowflake alike.
quoting:
  identifier: false

# Configuring models — medallion layers.
# Intermediate models live inside silver (models/silver/intermediate) and
# materialize into the silver schema.
models:
  healthcare_analytics:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
  elementary:
    ## elementary models will be created in the schema '<your_schema>_elementary'
    +schema: "elementary"
    ## Elementary does not support DuckDB — prod (Databricks) only, and off
    ## unless ENABLE_ELEMENTARY=true is set (default: disabled)
    +enabled: "{{ target.name == 'prod' and env_var('ENABLE_ELEMENTARY', 'false') == 'true' }}"

# Simple seed configuration — seeds land in the bronze layer
seeds:
  healthcare_analytics:
    +schema: bronze